[project]
name = "QUT"
version = "1.0.0"
description = "Python framework for quantum unit tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "colorama == 0.4.6",
    "matplotlib == 3.11.2",
    "numpy == 2.5.3",
    "qiskit == 2.5.2",
    "qiskit_aer == 0.17.2",
    "qiskit_experiments == 0.14.2",
    "qiskit_ibm_runtime == 0.50.0",
    "scikit_learn == 1.9.1",
    "scipy == 1.18.1",
    "setuptools == 84.0.0",
]

[project.urls]
Homepage = "https://github.com/freude/QUT"
